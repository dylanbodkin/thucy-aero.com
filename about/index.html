<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c0f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="About Thucydides Aerospace Inc.: our founders.">
  <title>About — Thucydides Aerospace Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?rev=18">
  <link rel="icon" type="image/png" href="/logo2.png">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main">
        <a href="/about/" class="nav-link" aria-current="page">About</a>
        <a href="/" class="brand">
          <img src="/logo2.png" alt="" class="brand-logo" width="56" height="56">
          <span class="brand-name">Thucydides Aerospace Inc.</span>
        </a>
        <a href="/milestones/" class="nav-link">Milestones</a>
      </nav>
    </header>

    <main class="about">
      <h1 class="visually-hidden">About</h1>
      <section class="about-section" aria-labelledby="founders-title">
        <h2 class="section-title" id="founders-title">Founders</h2>
        <!--
          One <li class="member"> per founder. Photos are in /about/media/:
          square, 448 x 448 JPEG, metadata removed (see README).
        -->
        <ul class="team-grid">
          <li class="member">
            <img src="/about/media/dylan.jpg" alt="Portrait of Dylan" class="member-photo"
                 width="448" height="448">
            <h3 class="member-name">Dylan</h3>
            <p class="member-role">CEO</p>
          </li>
          <li class="member">
            <img src="/about/media/andrew.jpg" alt="Portrait of Andrew" class="member-photo"
                 width="448" height="448">
            <h3 class="member-name">Andrew</h3>
            <p class="member-role">CTO</p>
          </li>
        </ul>
      </section>
    </main>

    <section class="contact" aria-label="Contact">
      <p class="contact-line">
        Interested in Thucydides Aerospace? — <a href="mailto:dylan@thucy-aero.com">dylan@thucy-aero.com</a>
      </p>
    </section>

    <footer class="footer">
      <p>&copy; 2026 Thucydides Aerospace Inc. All Rights Reserved.</p>
    </footer>
  </div>
</body>
</html>
